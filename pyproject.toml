[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimizer-v4"
version = "4.0.8"
description = "Vectorized optimization toolbox for system-defined control problems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
    "rich>=13",
]
authors = [
    {name = "OPTIMIZER v4 contributors"},
]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
scientific = [
    "scipy>=1.10",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7",
]

[project.scripts]
optimizer = "optimizer.cli.main:main"
optimizer-system = "optimizer.system_olgs.scaffold:main"
optimizer-mcp = "optimizer.mcp.server:main"

[tool.setuptools.packages.find]
include = ["optimizer", "optimizer.*"]

[tool.setuptools.package-data]
"optimizer.system_olgs.templates" = ["*.tmpl"]
"optimizer.system_olss.templates" = ["*.tmpl"]
