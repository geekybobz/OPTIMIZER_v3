[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimizer-v4"
version = "4.0.4"
description = "Vectorized optimization toolbox for system-defined control problems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
]
authors = [
    {name = "OPTIMIZER v4 contributors"},
]

[project.optional-dependencies]
scientific = [
    "scipy>=1.10",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7",
]

[project.scripts]
optimizer-system = "optimizer.system_olgs.scaffold:main"

[tool.setuptools.packages.find]
include = ["optimizer", "optimizer.*", "optimizer_log", "optimizer_log.*"]

[tool.setuptools.package-data]
"optimizer.system_olgs.templates" = ["*.tmpl"]
